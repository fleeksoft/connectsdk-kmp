product:
  type: lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, iosX64 ]

aliases:
  - jvmAndAndroid: [ android, jvm ]

dependencies:
  - $libs.kotlinx.serialization
  - $libs.kotlinx.coroutines
  - $libs.kotlinx.datetime
  - $libs.uuid
  - $libs.stately.concurrent
  - $libs.logger
  - $libs.ktor.client.core
  - $libs.rsocket.core
  - $libs.rsocket.ktor.tcp
  - $libs.urlencoder
  - $libs.korlibs.io

dependencies@android:
  - $libs.kotlinx.coroutines.android

dependencies@jvm:
  - $libs.kotlinx.coroutines.swing

dependencies@jvmAndAndroid:
  - $libs.ktor.client.okhttp
  - $libs.jmdns

dependencies@ios:
  - $libs.ktor.client.darwin

test-dependencies:
  - $libs.kotlinx.coroutines.test
  - $libs.ktor.client.mock

test-dependencies@jvmAndAndroid:
  - $libs.junit
  - $libs.mockito.core
  - $libs.mockito.inline
  - $libs.mockito.kotlin
  - xmlunit:xmlunit:1.6

settings:
  kotlin:
    serialization:
      format: json
      version: 1.10.0
    version: 2.3.0